name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - name: Install
        # setup-uv's python-version doesn't create a venv, and `uv pip install` refuses to
        # run without one (exit 2). Create it and put it on PATH for the later steps.
        run: |
          uv venv --python 3.11 .venv
          uv pip install -e ".[dev]"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Test
        run: pytest
